name: Mpanisa Bot

on:
  workflow_dispatch:  # Déclenché par cron-job.org via l'API GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 115  # Max 1h55 — s'arrête automatiquement si problème

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        timeout-minutes: 110
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CALLMEBOT_USER: ${{ secrets.CALLMEBOT_USER }}
        run: python bot.py
